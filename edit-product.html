<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Modifier un souhait | WICHLIST</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body data-protected="true">
    <header class="site-header"><a class="brand" href="index.html">WICH<span>LIST</span></a><a class="text-link" href="index.html">Retour à ma wishlist</a></header>
    <main class="form-shell">
        <p class="eyebrow">UN PETIT AJUSTEMENT</p>
        <h1>Modifier un souhait</h1>
        <p class="form-intro">Mettez à jour les informations quand vous le souhaitez.</p>
        <div id="form-message" class="alert" role="status" hidden></div>
        <form id="edit-product-form" class="wish-form">
            <div class="mb-3"><label for="product-title" class="form-label">Titre <span class="required-mark">*</span></label><input class="form-control" id="product-title" name="title" type="text" maxlength="180" required></div>
            <div class="mb-3"><label for="product-url" class="form-label">Lien du produit <span class="optional-label">facultatif</span></label><input class="form-control" id="product-url" name="product_url" type="url" placeholder="https://…"></div>
            <button class="btn btn-outline-dark analyze-button" type="button" id="analyze-link">Analyser le lien</button>
            <div class="row g-3 mt-1"><div class="col-sm-8"><label for="product-price" class="form-label">Prix <span class="optional-label">facultatif</span></label><input class="form-control" id="product-price" name="price" type="number" min="0" step="0.01" inputmode="decimal"></div><div class="col-sm-4"><label for="currency" class="form-label">Devise</label><select class="form-select" id="currency" name="currency"><option value="EUR">EUR €</option><option value="USD">USD $</option><option value="GBP">GBP £</option><option value="CAD">CAD $</option><option value="CHF">CHF</option></select></div></div>
            <p id="price-note" class="small-note" data-checked-at=""></p>
            <div class="mb-3"><label for="product-image" class="form-label">Image <span class="optional-label">JPEG, PNG ou WebP · 5 Mo max.</span></label><input class="form-control" id="product-image" type="file" accept="image/jpeg,image/png,image/webp"></div>
            <div id="image-preview-wrap" class="image-preview-wrap" hidden><img id="preview-image" alt="Aperçu de l’image du souhait"><button id="remove-image" class="btn btn-sm btn-outline-danger" type="button" data-remove="false">Retirer l’image</button></div>
            <div class="form-actions"><button class="btn btn-primary" type="submit">Enregistrer</button><a class="btn btn-light" href="index.html">Annuler</a></div>
        </form>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script><script src="js/auth.js"></script><script src="js/products.js"></script><script src="js/product-parser.js"></script><script src="js/app.js"></script>
</body>
</html>
