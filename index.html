<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f7f7f2">
    <title>Ma wishlist | WICHLIST</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body data-protected="true">
    <header class="site-header">
        <a class="brand" href="index.html" aria-label="WICHLIST, accueil">WICH<span>LIST</span></a>
        <button id="logout" class="btn btn-outline-dark" type="button">Déconnexion</button>
    </header>
    <main class="page-shell">
        <section class="page-heading">
            <div>
                <p class="eyebrow">VOS ENVIES, AU MÊME ENDROIT</p>
                <h1>Ma wishlist</h1>
            </div>
            <a class="btn btn-primary add-button" href="add-product.html" aria-label="Ajouter un souhait"><span aria-hidden="true">+</span><span class="add-label">Ajouter un souhait</span></a>
        </section>
        <div id="page-message" class="alert alert-danger" role="status" hidden></div>
        <section id="wishlist-summary" class="wishlist-summary" aria-label="Total de ma wishlist" hidden>
            <div>
                <p class="summary-label">Total de la wishlist</p>
                <p class="summary-note">Conversion au taux de référence, avec date affichée.</p>
            </div>
            <div class="summary-controls">
                <label class="visually-hidden" for="wishlist-currency">Devise du total</label>
                <select id="wishlist-currency" class="form-select" aria-label="Devise du total"></select>
                <output id="wishlist-total" class="summary-amount" aria-live="polite"></output>
            </div>
        </section>
        <section id="wishlist" class="product-grid" aria-live="polite" aria-label="Mes souhaits"></section>
        <section id="empty-message" class="empty-state" hidden>
            <div class="empty-mark" aria-hidden="true">＋</div>
            <h2>La suite vous appartient.</h2>
            <p>Ajoutez le premier objet que vous aimeriez garder en tête.</p>
            <a class="btn btn-primary" href="add-product.html">Ajouter mon premier souhait</a>
        </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/products.js"></script>
    <script src="js/product-parser.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
