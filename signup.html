<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Créer un compte | WICHLIST</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
    <main class="auth-shell">
        <a class="brand auth-brand" href="login.html">WICH<span>LIST</span></a>
        <p class="eyebrow">VOTRE ESPACE PERSONNEL</p><h1>Créer un compte</h1><p class="form-intro">Une adresse e-mail et un mot de passe suffisent.</p>
        <div id="auth-message" class="alert" role="status" hidden></div>
        <form id="signup-form" class="wish-form">
            <div class="mb-3"><label class="form-label" for="email">Adresse e-mail</label><input class="form-control" id="email" name="email" type="email" autocomplete="email" required></div>
            <div class="mb-3"><label class="form-label" for="password">Mot de passe <span class="optional-label">6 caractères minimum</span></label><input class="form-control" id="password" name="password" type="password" minlength="6" autocomplete="new-password" required></div>
            <button class="btn btn-primary w-100" type="submit">Créer mon compte</button>
        </form>
        <p class="auth-switch">Déjà inscrit ? <a href="login.html">Se connecter</a></p>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase.js"></script><script src="js/auth.js"></script>
</body>
</html>
